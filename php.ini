; --- Configuration PHP de production pour MarvelTravel ---

; Ne jamais afficher les erreurs aux visiteurs :
; le texte d'erreur affiché casse les header()/setcookie() qui suivent.
display_errors = Off
display_startup_errors = Off

; Les erreurs sont journalisées (visibles dans les logs Railway) au lieu d'être affichées.
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; Bufferise la sortie : autorise header()/setcookie() même après l'envoi de HTML.
; Corrige les "Cannot modify header information - headers already sent".
output_buffering = 4096

; Fuseau horaire par défaut (évite les warnings sur les fonctions de date).
date.timezone = Europe/Paris

; Durcit un peu les cookies de session.
session.cookie_httponly = 1
